name: Zig validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Verify the validation harness before relying on build results.
      # This exercises error propagation with a simulated Zig executable;
      # the following steps use the actual Zig 0.17.0 toolchain.
      - name: Check validation scripts syntax
        run: |
          sh -n tools/validate_zig_017.sh
          sh -n tools/test_validate_zig_017.sh
      - name: Test validation harness
        run: sh tools/test_validate_zig_017.sh
      - name: Verify compiler version
        run: test "$(zig version)" = '0.17.0'
      # Formatting and build steps share the same local/CI validation sequence.
      - name: Validate NitroUI (format, Debug, ReleaseFast, integration, benchmark)
        run: sh tools/validate_zig_017.sh
