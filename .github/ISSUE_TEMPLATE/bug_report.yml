name: Bug report
description: Report a reproducible defect in NitroUI
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include minimal Zig code and commands.
    validations:
      required: true
  - type: input
    id: zig
    attributes:
      label: Zig version
      placeholder: 0.17.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
